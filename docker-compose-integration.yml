# Docker Compose for Integration Testing
#
# Self-contained compose file that includes base infrastructure and defines
# all backend microservices for running integration tests.
#
# Usage:
#   # One command (builds, tests, cleans up):
#   pnpm test:integration:docker
#
#   # Or manually:
#   docker compose -f docker-compose-integration.yml up -d --build
#   pnpm test:integration
#   docker compose -f docker-compose-integration.yml down -v

include:
  - docker-compose.yml  # Base: Supabase, Redis, observability

x-backend-env: &backend-env
  NODE_ENV: test
  PROJECT: opuspopuli
  VERSION: 1.0.0
  RESEND_API_KEY: re_test_placeholder_key
  RELATIONAL_DB_PROVIDER: postgres
  RELATIONAL_DB_HOST: opuspopuli-db
  RELATIONAL_DB_PORT: 5432
  RELATIONAL_DB_USERNAME: postgres
  RELATIONAL_DB_PASSWORD: your-super-secret-password
  # Integration stack targets `postgres_test` so it can't wipe dev state.
  # The test-runner's globalSetup bootstraps the DB before any service
  # connects. Pairs with the cleanDatabase() guard in db-cleanup.ts.
  # See OpusPopuli/opuspopuli#796. DO NOT revert to `postgres`.
  RELATIONAL_DB_DATABASE: postgres_test
  DATABASE_URL: postgresql://postgres:your-super-secret-password@opuspopuli-db:5432/postgres_test
  REDIS_URL: redis://redis:6379
  SUPABASE_URL: http://supabase-kong:8000
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.KR1jqUlyHtwAxCJf6B0QVoRpobrdPEv8ALnNJUlGxPE
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.sF_hc5jg-YhscQGb00SNtjW3ZIyDlGIIQppgOLwHGiM
  GATEWAY_CLIENT_ID: api-gateway
  GATEWAY_HMAC_SECRET: integration-test-hmac-secret
  API_KEYS: '{"api-gateway":"integration-test-hmac-secret"}'
  JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters
  AUTH_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters
  SMTP_HOST: inbucket
  SMTP_PORT: "2500"
  SMTP_ADMIN_EMAIL: noreply@opuspopuli.local
  FRONTEND_URL: http://localhost:3300

# Docker's json-file driver defaults to NO rotation and NO size cap, so container
# logs grow without bound. On the us-ca production node on 2026-08-13 that was
# one of two independent paths to a full disk — region-worker's log alone had
# reached 3,488 MB from a single campaign-finance sync, and nothing ever
# reclaimed it. Postgres then crash-looped on "No space left on device".
#
# Lower stakes here (these files build locally and run on dev machines and CI
# runners rather than in production) but the identical mechanism: a `pnpm dev`
# stack runs 24 services indefinitely, and integration/e2e runs are log-heavy
# and repeat constantly.
#
# 50m x 5 caps each container at 250 MB. Fixed on the node repos in
# opuspopuli-node-us-ca#29 and opuspopuli-node#49 (#1001).
x-logging: &logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  db-migrate:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.test-runner
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-db-migrate
    logging: *logging
    environment:
      <<: *backend-env
    depends_on:
      opuspopuli-db:
        condition: service_healthy
    command: ["/usr/local/bin/db-migrate.sh"]
    networks:
      - opuspopuli-network

  users:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.users
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-integration-users
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: users
      DESCRIPTION: Users microservice
      PORT: 8080
    ports:
      - "3001:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped

  documents:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.documents
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-integration-documents
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: documents
      DESCRIPTION: Documents microservice
      PORT: 8080
    ports:
      - "3002:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped

  knowledge:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.knowledge
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-integration-knowledge
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: knowledge
      DESCRIPTION: Knowledge microservice
      PORT: 8080
    ports:
      - "3003:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped

  region:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.region
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-integration-region
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: region
      DESCRIPTION: Region microservice
      PORT: 8080
    ports:
      - "3004:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.api
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-integration-api
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: api
      DESCRIPTION: API Gateway
      PORT: 8080
      MICROSERVICES: '[{"name":"users","url":"http://users:8080/graphql"},{"name":"documents","url":"http://documents:8080/graphql"},{"name":"knowledge","url":"http://knowledge:8080/graphql"},{"name":"region","url":"http://region:8080/graphql"}]'
    ports:
      - "3000:8080"
    depends_on:
      users:
        condition: service_healthy
      documents:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      region:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped

  # Test runner container - runs integration tests inside Docker
  # Builds its own node_modules to ensure correct platform bindings
  test-runner:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.test-runner
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-test-runner
    logging: *logging
    command: ["/bin/sh", "/usr/local/bin/test-runner.sh"]
    environment:
      <<: *backend-env
      # Container networking URLs
      INBUCKET_URL: http://inbucket:9000
      API_GATEWAY_URL: http://api:8080
      USERS_SERVICE_URL: http://users:8080
      DOCUMENTS_SERVICE_URL: http://documents:8080
      KNOWLEDGE_SERVICE_URL: http://knowledge:8080
      REGION_SERVICE_URL: http://region:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opuspopuli-network
    profiles:
      - test
