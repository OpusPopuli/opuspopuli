# Prometheus Alerting Rules for OPUSPOPULI
# @see https://github.com/OpusPopuli/opuspopuli/issues/308

groups:
  - name: opuspopuli-service-health
    rules:
      # Alert when a scrape target is unreachable for 2 minutes
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes."

      # Alert when HTTP error rate exceeds 5% over 5 minutes
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has >5% HTTP 5xx error rate (current: {{ $value | humanizePercentage }})."

  - name: opuspopuli-document-pipeline
    rules:
      # Alert when OCR failure rate spikes (>10% over 10 minutes)
      - alert: OcrFailureSpike
        expr: |
          (
            sum(rate(ocr_extractions_total{status="failure"}[10m])) by (service)
            /
            sum(rate(ocr_extractions_total[10m])) by (service)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OCR failure rate spiking on {{ $labels.service }}"
          description: "OCR failure rate >10% for 5 minutes (current: {{ $value | humanizePercentage }})."

      # Alert when scan failure rate exceeds 5%
      - alert: HighScanFailureRate
        expr: |
          (
            sum(rate(document_scans_total{status="failure"}[10m])) by (service)
            /
            sum(rate(document_scans_total[10m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scan failure rate on {{ $labels.service }}"
          description: "Scan failure rate >5% for 5 minutes (current: {{ $value | humanizePercentage }})."

      # Alert when scan processing p95 latency exceeds 5 seconds
      - alert: HighScanLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(document_scan_duration_seconds_bucket[5m])) by (service, le)
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scan latency on {{ $labels.service }}"
          description: "p95 scan processing latency >5s (current: {{ $value | humanizeDuration }})."

      # Alert when analysis failure rate exceeds 10%
      - alert: HighAnalysisFailureRate
        expr: |
          (
            sum(rate(document_analyses_total{status="failure"}[10m])) by (service)
            /
            sum(rate(document_analyses_total[10m])) by (service)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI analysis failure rate on {{ $labels.service }}"
          description: "AI analysis failure rate >10% for 5 minutes (current: {{ $value | humanizePercentage }})."

  # Backup freshness — opuspopuli#1217.
  #
  # Production backups stopped on 2026-07-23 and nobody noticed for 49 days.
  # Nothing in the deploy path restarts the backup container (op-deploy
  # excludes docker-compose-backup.yml by design), so a node that is never
  # redeployed can go quiet indefinitely. These rules make that loud.
  #
  # Source: backup-db.sh / backup-prompts-db.sh write a Prometheus textfile
  # (.prom) on completion; node_exporter's textfile collector serves it.
  # If backups stop, the gauge stops advancing and BackupStale fires. If the
  # node or exporter dies, the series disappears and BackupMissing fires.
  # Both failure modes must alert — the 2026-07-23 outage was the first kind.
  - name: opuspopuli-backups
    rules:
      # Backups run daily (10:00 UTC main, 10:10 UTC prompts). 36h allows a
      # single missed window plus slack before paging, so one transient
      # failure does not wake anyone, but two consecutive ones do.
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 129600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup of {{ $labels.database }} in over 36h"
          description: >-
            Last successful backup of {{ $labels.database }} was
            {{ $value | humanizeDuration }} ago (threshold 36h). Check the
            backup container: `docker ps --filter name=opuspopuli-backup`
            and /backups/backup.log. See docs/runbooks/restore-drill.md.

      # A silent stop also looks like an absent series — e.g. the backup
      # container was never started after a reboot, so it never wrote a
      # .prom file at all. `absent()` is what catches the 2026-07-23 shape.
      - alert: BackupMissing
        expr: absent(backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup metrics absent — backups may not be running at all"
          description: >-
            No backup_last_success_timestamp_seconds series is being
            scraped. Either node_exporter's textfile collector is down or
            the backup job has never run on this node.

      # Distinct from staleness: the job ran and failed. Fires sooner
      # because a known failure needs no waiting period to be credible.
      - alert: BackupFailing
        expr: backup_last_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Last backup of {{ $labels.database }} failed"
          description: >-
            backup-db.sh exited non-zero. Inspect /backups/.backup.lasterr
            and backup.log. Staleness will escalate to critical at 36h.

  # ── Source store (#1278) ────────────────────────────────────────────────
  #
  # The store is the one component whose growth is unbounded if the tiering
  # is wrong, and the epic sized it as "no hardware purchase required" on
  # the basis of ~1-3 GB/yr for cited sources and ~12-13 GB/yr for the bulk
  # tier at latest-plus-monthly retention. These alerts fire when reality
  # departs from that arithmetic, so the sizing is re-decided on evidence
  # rather than discovered when a disk fills.
  #
  # Thresholds are stated as the sizing they defend, not as round numbers.
  - name: opuspopuli-source-store
    rules:
      # 3 GB/yr is the top of the cited tier's sized range. Alerting at 2x
      # that rate leaves room for a genuine burst of civic activity while
      # still catching a tiering mistake within a week of it starting.
      # 6 GB/yr = 6e9 / 365.25 / 86400 = ~190 B/s.
      - alert: SourceStoreCitedGrowthExceedsSizing
        expr: deriv(source_store_bytes{tier="cited",location="postgres"}[7d]) > 190
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Cited source tier growing faster than it was sized for"
          description: >-
            The cited tier is growing at {{ $value | humanize }}B/s, which
            annualises above 6 GB/yr against a sized 1-3 GB/yr. This tier is
            immutable — nothing prunes it — so the growth compounds. Check
            whether something is archiving pages that are not cited sources.
            See docs/plans/1276-source-version-store.md.

      # The bulk tier is pruned to latest + one per calendar month, so its
      # steady state is bounded by snapshot size, not fetch frequency. Growth
      # well above that means retention is not running, which is the failure
      # this tier's whole design depends on not happening.
      # 26 GB/yr (2x the sized 12-13) = ~825 B/s.
      - alert: SourceStoreBulkGrowthExceedsSizing
        expr: deriv(source_store_bytes{tier="bulk"}[7d]) > 825
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Bulk archive growing as if retention were not running"
          description: >-
            The bulk tier is growing at {{ $value | humanize }}B/s, above the
            ~12-13 GB/yr its retention schedule should bound it to. Most
            likely the retention sweep is not being invoked. See
            SnapshotRetentionService and docs/plans/1277-bulk-archive-tier.md.

      # Snapshots recorded with no payload. Expected to be zero; a non-zero
      # value means uploads are failing — on a Supabase-backed deployment,
      # most likely the 50 MB per-file limit rejecting a ~1 GB export.
      # Provenance still resolves, but the bytes are not being kept.
      - alert: SourceStoreBulkUploadsFailing
        expr: source_store_objects{tier="bulk",state="unstored"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Bulk snapshots are being recorded without their bytes"
          description: >-
            {{ $value }} snapshot(s) have a row but no stored payload. The
            provenance chain still resolves, but the export itself is not
            being retained. Check the archive bucket's per-file size limit.

      # The measurement itself stopping is the #1217 failure shape: a gauge
      # that stops updating keeps reporting its last value, and the number
      # looks fine because it is stale. Collection runs every 5 minutes.
      - alert: SourceStoreMetricsStale
        expr: time() - source_store_last_measured_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Source-store metrics for {{ $labels.tier }} have stopped updating"
          description: >-
            No successful measurement of the {{ $labels.tier }} tier in over
            an hour, against a 5-minute collection interval. The size gauges
            are now stale and must not be trusted for a capacity decision.

      # And the absent-series case, for the same reason BackupMissing exists:
      # a service that never started reports nothing at all, which no
      # threshold on the value itself can catch.
      - alert: SourceStoreMetricsMissing
        expr: absent(source_store_last_measured_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Source-store metrics absent — nothing is measuring the store"
          description: >-
            No source_store_last_measured_timestamp_seconds series is being
            scraped. Either region-service is down or its metrics endpoint is
            not reachable from Prometheus.
