# Grafana Datasource Provisioning
# Auto-configures Prometheus, Loki, and Tempo as datasources
#
# EVERY datasource declares an explicit `uid`, and must keep doing so.
# Dashboards reference a datasource by uid, not by name: provisioned without
# one, Grafana generates a random uid (dev held `PBFA97CFB590B2093` for
# Prometheus and `P8E80F9AEF21F6940` for Loki), and every panel pointing at
# `uid: prometheus` renders "Datasource not found" instead. That had silently
# broken three of the four dev dashboards — Analytics, Services and Source
# Store, 35 panel references between them — plus Tempo's `tracesToLogs` and
# `lokiSearch`, which name `loki` below. Only the Users dashboard worked,
# because Postgres was the one datasource that declared its uid.
#
# The uids match opuspopuli-node's own provisioning, so a dashboard committed
# in either repo resolves in both.
#
# @see https://github.com/OpusPopuli/opuspopuli/issues/213
# @see https://github.com/OpusPopuli/opuspopuli/issues/466

apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"
      httpMethod: POST
      # Makes a histogram exemplar clickable through to its trace (M1,
      # `docs/plans/ingestion-resource-lanes.md` §2). `name` is the LABEL
      # prom-client attaches at the call site — `withStage` emits `trace_id`,
      # the OpenTelemetry convention — and it must match exactly or Grafana
      # draws the exemplar dots with nothing behind them.
      #
      # This is the third of FOUR independent switches, all required: the
      # backend must serve OpenMetrics (prom-client renders exemplars in no
      # other format), Prometheus must run with
      # `--enable-feature=exemplar-storage`, the destination below must name
      # the label, and the PANEL's target must carry `"exemplar": true` or
      # Grafana never calls /api/v1/query_exemplars at all. Miss any one and
      # the links are absent with no error anywhere.
      #
      # Note the node repo (production) has neither the Prometheus flag nor
      # this block yet, so exemplars are discarded there — see
      # `docs/plans/ingestion-resource-lanes.md`.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # Loki - Logs (with trace correlation)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"

  # Tempo - Distributed Traces
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        tags: ["service"]
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  # Postgres - user analytics (#1085 branch, user dashboard)
  #
  # Prometheus carries no auth or user metrics, so the Users dashboard reads
  # the database directly. Two rules come with that:
  #
  #   1. This must be a READ-ONLY role. Grafana panels are SQL, panels are
  #      editable, and anyone with dashboard access is one typo away from a
  #      write against live user data. See docs/guides/user-dashboard.md for
  #      the role definition.
  #   2. No credentials in this file. The values come from the environment,
  #      defaulted in docker-compose.yml for local use only.
  #
  # Grafana expands ${VAR} from its own environment here; the `:-default`
  # form is docker-compose syntax and does NOT work in provisioning files,
  # which is why the defaults live in the compose service instead.
  - name: OpusPopuli DB
    uid: opuspopuli-postgres
    type: postgres
    access: proxy
    url: ${GRAFANA_DB_HOST}
    database: ${GRAFANA_DB_NAME}
    user: ${GRAFANA_DB_USER}
    editable: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: ${GRAFANA_DB_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
