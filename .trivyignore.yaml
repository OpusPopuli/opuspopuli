# Trivy filesystem-scan suppressions. Keep narrow — broad suppressions
# defeat the point of the scanner. Each entry needs a justification
# tying back to a non-filesystem-scan source of truth (gitleaks for
# history, .gitignore for trackability).

secrets:
  # apps/backend/docker/scripts/db-migrate.sh seeds the well-known
  # self-hosted Supabase demo anon JWT into Vault as a dev default
  # (overridable via SEED_SUPABASE_ANON_KEY for hosted projects). This
  # is the publicly documented Supabase demo value — meaningless without
  # the matching demo pgsodium_secret_key that ships with the same
  # self-hosted install. Not a secret in any operational sense. The same
  # JWT lives unflagged in docker-compose-uat.yml as the
  # SUPABASE_SERVICE_ROLE_KEY (trivy's YAML scanner accepts dev patterns
  # there but the shell-script context triggers detection). See
  # docs/guides/secrets-management.md and issue #792.
  #
  # Remove this entry if the dev-default JWT is ever moved out of this
  # script (e.g., into docker-compose env passthrough).
  - id: jwt-token
    paths:
      - "apps/backend/docker/scripts/db-migrate.sh"

vulnerabilities:
  # braces stack-exhaustion DoS, GHSA-vfj7-8cjw-p6xm (HIGH). Suppressed on the
  # pnpm side only (`auditConfig.ignoreGhsas`) — Trivy runs with
  # --ignore-unfixed and so never raises it. Recorded here because this file is
  # where this repo keeps its suppression justifications, and an entry in
  # `ignoreGhsas` cannot carry one: JSON has no comments. That gap is already a
  # recorded compliance exception (E-6 in
  # docs/compliance/releases/v1.22.0-validation.md), and adding a third
  # unexplained id would widen it.
  #
  # Unfixable: braces 3.0.3 is the latest published version and the advisory
  # covers `<=3.0.3`. There is nothing to override to.
  #
  # Not reachable: the only --prod path is
  # `@nestjs/graphql > fast-glob > micromatch > braces`, and @nestjs/graphql
  # reaches fast-glob only through `typePaths`, the schema-first file-glob
  # option. All four subgraphs are code-first (`autoSchemaFile`, see
  # apps/backend/src/apps/*/src/app.module.ts) and none sets `typePaths`, so
  # no glob pattern is ever handed to micromatch. The DoS needs an
  # attacker-supplied deeply-nested brace pattern; there is no path by which a
  # request reaches this library at all.
  #
  # Remove when braces publishes a patched release (track: #1336).
  #
  # MapLibre GL JS XSS sanitizer bypass (CVSS 10). The same advisory pnpm
  # audit knows as GHSA-jrc7-96c5-q579, suppressed there in
  # pnpm-workspace-level `auditConfig.ignoreGhsas` — Trivy carries its own
  # database, so suppressing one gate and not the other leaves CI red on a
  # finding we have already assessed and accepted.
  #
  # Unfixable for us: the vulnerable range covers ALL of maplibre 5.x, and
  # no deck.gl release supports the patched 6.4.1+ — the map renders blank
  # (attempted and reverted, see #1187).
  #
  # Not reachable: `sanitize()` has exactly one call site in the installed
  # bundle, the attribution control, which every map disables; the style
  # carries no sources, so there is no attribution HTML to sanitize at all;
  # and no Popup/setHTML/setDOMContent appears in components/map.
  #
  # That reachability argument is ENFORCED, not just recorded, by
  # apps/frontend/__tests__/components/map/maplibre-sanitize-guard.test.ts —
  # verified by introducing each violation and confirming it fails.
  #
  # Remove this entry when deck.gl supports maplibre 6 and we take 6.4.1+.
  - id: CVE-2026-85061

