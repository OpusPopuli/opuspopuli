# =============================================================================
# Release — Build, Push, Sign & SBOM
# =============================================================================
#
# Triggered by pushing a `v*` tag. Builds Docker images for each microservice,
# pushes to GHCR, signs with Sigstore keyless cosign, and generates + attaches
# SPDX SBOMs.
#
#   git tag v1.6.0 && git push origin v1.6.0
#
# Tag-triggered rather than push-to-main, for two reasons.
#
# Merging must not mean shipping. Under trunk-based development every feature
# lands on main, so a branches:[main] trigger would publish `:latest` on every
# merge — and the Studio pulls `:latest`. A routine merge would become a
# production image with no deliberate step in between.
#
# And it makes tagging load-bearing. v1.4.0 and v1.5.0 both shipped images and
# were never tagged, because nothing depended on the tag existing; the release
# record simply stopped at v1.3.0 while three more releases went out. Now the
# tag IS the release, so that class of drift cannot recur.
#
# See docs/guides/container-verification.md for how to verify images.
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger for ad-hoc publishes — e.g. a Studio operator needs a build
  # off a fix branch before it ships. Triggered from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/opuspopuli

jobs:
  build-sign-publish:
    name: Build, Sign & Publish — ${{ matrix.service }}
    # arm64 runner, building arm64 natively. Every consumer of these images is
    # Apple Silicon — the production Mac Studio and local dev machines — and the
    # frontend is not containerised at all, so there is no amd64 consumer to
    # serve. Building on an amd64 runner meant the only architecture actually
    # deployed was the one going through QEMU emulation: 1,039s for
    # region-worker alone on v1.7.0, ~45 min for the full matrix. See #1003.
    #
    # Free for public repositories, which this is. If a private fork needs this
    # workflow, `ubuntu-24.04-arm` is billable there.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/backend/docker/Dockerfile.api
          - service: users
            dockerfile: apps/backend/docker/Dockerfile.users
          - service: documents
            dockerfile: apps/backend/docker/Dockerfile.documents
          - service: knowledge
            dockerfile: apps/backend/docker/Dockerfile.knowledge
          - service: region
            dockerfile: apps/backend/docker/Dockerfile.region
          # Async workers — same Dockerfile pattern, published so the prod
          # compose can pull them instead of building locally on the Studio.
          - service: region-worker
            dockerfile: apps/backend/docker/Dockerfile.region-worker
          - service: structural-analysis-worker
            dockerfile: apps/backend/docker/Dockerfile.structural-analysis-worker
          - service: llm-rerank-worker
            dockerfile: apps/backend/docker/Dockerfile.llm-rerank-worker
          # Migration runner — image name = compose service name (db-migrate).
          # Shares Dockerfile.test-runner with the test/integration harness;
          # the prod use case runs db-migrate.sh as its CMD.
          - service: db-migrate
            dockerfile: apps/backend/docker/Dockerfile.test-runner

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # No QEMU step. It existed only to cross-compile arm64 layers on an amd64
      # runner; the runner is now arm64, so the build is native and emulation
      # would only slow it down. Re-add it if linux/amd64 ever comes back.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            # v1.6.0 -> 1.6.0. Gives every image a version that matches the git
            # tag and the GitHub Release, so "what is running in prod" is
            # answerable from the image alone. Empty on workflow_dispatch,
            # which is correct — an ad-hoc build is not a version.
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # arm64 only, built natively on an arm64 runner. Apple Silicon Mac
          # Studio operators need this manifest; nothing deployed needs amd64.
          # Adding it back is a one-line change here plus restoring the QEMU
          # step above — or, better, a second native amd64 job whose manifests
          # are merged with `docker buildx imagetools create`, so neither
          # architecture pays an emulation penalty.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # Cache scoped per service so the nine builds don't evict each other.
          # The scope name is unchanged, so the first run after the switch to
          # arm64 reads entries written by the old multi-arch build; layers for
          # a different architecture simply miss, and the run rewrites the
          # scope. Expect one cold-ish release, then normal hit rates.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90
