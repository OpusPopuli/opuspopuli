<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Sunflower brand system: ink ground, paper artwork, gold earned -->
  <defs>
    <!-- one sunflower, drawn in local 0..100 coords: stem base at (50,88), disc at (50,40) -->
    <g id="sf">
      <line x1="50" y1="88" x2="50" y2="40" stroke="#FAFAF8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 50 40 C 50 36, 49 30, 50 26 C 51 22, 53 20, 50 18 C 47 20, 47 26, 48 31 C 46 27, 43 22, 40 21 C 36 20, 34 24, 35 28 C 36 32, 40 34, 44 33 C 40 35, 35 37, 34 41 C 33 45, 35 49, 38 50 C 41 51, 45 49, 46 46 C 44 50, 43 56, 45 60 C 47 64, 51 65, 54 63 C 57 61, 57 57, 55 53 C 58 57, 62 60, 66 59 C 70 58, 71 54, 69 50 C 67 46, 63 44, 59 45 C 63 43, 67 39, 66 35 C 65 31, 61 29, 57 31 C 54 33, 53 37, 54 40" stroke="#FAFAF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="50" cy="40" r="10" fill="#E8C000"/>
    </g>
  </defs>

  <!-- ink ground -->
  <rect width="1200" height="630" fill="#1A1714"/>

  <!-- lockup: mark + OPUS POPULI + tagline, scaled 1.55x from 600x150, centered high -->
  <g transform="translate(135 150) scale(1.55)">
    <g transform="translate(6 8) scale(1.34)">
      <line x1="50" y1="88" x2="50" y2="40" stroke="#FAFAF8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 50 40 C 50 36, 49 30, 50 26 C 51 22, 53 20, 50 18 C 47 20, 47 26, 48 31 C 46 27, 43 22, 40 21 C 36 20, 34 24, 35 28 C 36 32, 40 34, 44 33 C 40 35, 35 37, 34 41 C 33 45, 35 49, 38 50 C 41 51, 45 49, 46 46 C 44 50, 43 56, 45 60 C 47 64, 51 65, 54 63 C 57 61, 57 57, 55 53 C 58 57, 62 60, 66 59 C 70 58, 71 54, 69 50 C 67 46, 63 44, 59 45 C 63 43, 67 39, 66 35 C 65 31, 61 29, 57 31 C 54 33, 53 37, 54 40" stroke="#FAFAF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="50" cy="40" r="10" fill="#E8C000"/>
    </g>
    <rect x="150" y="42" width="1.5" height="66" fill="#FAFAF8" fill-opacity="0.35"/>
    <text x="170" y="78" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#FAFAF8">OPUS POPULI</text>
    <text x="171" y="108" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#FAFAF8" fill-opacity="0.7">The Work of the People</text>
  </g>

  <!-- earned gold: the ground line the field grows from (>=3px filled accent) -->
  <rect x="140" y="520" width="920" height="3" rx="1.5" fill="#E8C000"/>

  <!-- a small field of sunflowers standing on the line: the work of the people -->
  <use href="#sf" transform="translate(197.5 461) scale(0.67)"/>
  <use href="#sf" transform="translate(330 449.4) scale(0.80)"/>
  <use href="#sf" transform="translate(486 437.8) scale(0.93)"/>
  <use href="#sf" transform="translate(660 431.2) scale(1.00)"/>
  <use href="#sf" transform="translate(830 443.6) scale(0.86)"/>
  <use href="#sf" transform="translate(985 452.8) scale(0.76)"/>

  <!-- domain, quiet, gold on ink (earned, text-on-ink is valid) -->
  <text x="1060" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.5" fill="#E8C000">opuspopuli.org</text>
</svg>
