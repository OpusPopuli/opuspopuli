# Docker Compose for E2E Testing
#
# Self-contained compose file that includes base infrastructure and defines
# all backend microservices for running E2E tests with Playwright.
#
# Key difference from integration: API gateway runs on port 4000 (not 3000)
# to avoid conflict with frontend on port 3000.
#
# Usage:
#   # Start services:
#   docker compose -f docker-compose-e2e.yml up -d --build --wait
#
#   # Run E2E tests:
#   NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql pnpm --filter frontend e2e
#
#   # Stop services:
#   docker compose -f docker-compose-e2e.yml down -v

include:
  - docker-compose.yml  # Base: Supabase, Redis, observability

x-backend-env: &backend-env
  NODE_ENV: test
  PROJECT: opuspopuli
  VERSION: 1.0.0
  RESEND_API_KEY: re_test_placeholder_key
  RELATIONAL_DB_PROVIDER: postgres
  RELATIONAL_DB_HOST: opuspopuli-db
  RELATIONAL_DB_PORT: 5432
  RELATIONAL_DB_USERNAME: postgres
  RELATIONAL_DB_PASSWORD: your-super-secret-password
  # E2E backend services target `postgres_test` so they share a database with
  # the integration test workers (globalSetup pins to postgres_test, either
  # explicitly via INTEGRATION_DATABASE_URL or by deriving from DATABASE_URL).
  # Without this, tests write fixtures to postgres_test and backend services
  # read empty results from `postgres` — manifesting as 0-count totals and
  # 'Cannot return null for non-nullable Query.findUser' errors. Mirrors the
  # docker-compose-integration.yml setup; db-migrate creates the database via
  # the conditional CREATE-IF-NOT-EXISTS block in db-migrate.sh. See #796.
  RELATIONAL_DB_DATABASE: postgres_test
  DATABASE_URL: postgresql://postgres:your-super-secret-password@opuspopuli-db:5432/postgres_test
  REDIS_URL: redis://redis:6379
  SUPABASE_URL: http://supabase-kong:8000
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.KR1jqUlyHtwAxCJf6B0QVoRpobrdPEv8ALnNJUlGxPE
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.sF_hc5jg-YhscQGb00SNtjW3ZIyDlGIIQppgOLwHGiM
  GATEWAY_CLIENT_ID: api-gateway
  GATEWAY_HMAC_SECRET: integration-test-hmac-secret
  API_KEYS: '{"api-gateway":"integration-test-hmac-secret"}'
  JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters
  AUTH_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters
  SMTP_HOST: inbucket
  SMTP_PORT: "2500"
  SMTP_ADMIN_EMAIL: noreply@opuspopuli.local
  FRONTEND_URL: http://localhost:3300

# Docker's json-file driver defaults to NO rotation and NO size cap, so container
# logs grow without bound. On the us-ca production node on 2026-08-13 that was
# one of two independent paths to a full disk — region-worker's log alone had
# reached 3,488 MB from a single campaign-finance sync, and nothing ever
# reclaimed it. Postgres then crash-looped on "No space left on device".
#
# Lower stakes here (these files build locally and run on dev machines and CI
# runners rather than in production) but the identical mechanism: a `pnpm dev`
# stack runs 24 services indefinitely, and integration/e2e runs are log-heavy
# and repeat constantly.
#
# 50m x 5 caps each container at 250 MB. Fixed on the node repos in
# opuspopuli-node-us-ca#29 and opuspopuli-node#49 (#1001).
x-logging: &logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  # Inbucket's host ports come from the base compose file, and its web UI
  # publish there — 54324 — sits inside Linux's default ephemeral range
  # (net.ipv4.ip_local_port_range = 32768-60999). On a CI runner any outbound
  # connection opened by an image pull or `pnpm install` can be holding that
  # port when Docker binds it, and the whole stack then fails to come up:
  #
  #   failed to bind host port for 0.0.0.0:54324:172.18.0.4:9000/tcp:
  #   address already in use
  #
  # That took out an E2E run on 2026-08-31 before a single test started. The
  # publish still has to exist, because the backend integration suite reads
  # captured mail over the host (`getMagicLinkFromInbucket`) — so re-publish
  # the UI below the ephemeral range instead. `!override` replaces the list;
  # a plain `ports:` would append to the base file's, keeping 54324.
  # CI passes the matching INBUCKET_URL; local dev keeps 54324 via
  # docker-compose.yml. SMTP is reached in-network (SMTP_HOST: inbucket), so
  # it needs no host publish here.
  inbucket:
    ports: !override
      - "18324:9000" # Web UI — read by the integration suite from the host

  db-migrate:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.test-runner
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-db-migrate
    logging: *logging
    environment:
      <<: *backend-env
    depends_on:
      opuspopuli-db:
        condition: service_healthy
    command: ["/usr/local/bin/db-migrate.sh"]
    networks:
      - opuspopuli-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  users:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.users
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-users
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: users
      DESCRIPTION: Users microservice
      PORT: 8080
    ports:
      - "3001:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  documents:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.documents
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-documents
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: documents
      DESCRIPTION: Documents microservice
      PORT: 8080
    ports:
      - "3002:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  knowledge:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.knowledge
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-knowledge
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: knowledge
      DESCRIPTION: Knowledge microservice
      PORT: 8080
    ports:
      - "3003:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  region:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.region
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-region
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: region
      DESCRIPTION: Region microservice
      PORT: 8080
    ports:
      - "3004:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # API Gateway - Port 4000 to avoid conflict with frontend on port 3000
  api:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile.api
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    container_name: opuspopuli-e2e-api
    logging: *logging
    environment:
      <<: *backend-env
      APPLICATION: api
      DESCRIPTION: API Gateway
      PORT: 8080
      MICROSERVICES: '[{"name":"users","url":"http://users:8080/graphql"},{"name":"documents","url":"http://documents:8080/graphql"},{"name":"knowledge","url":"http://knowledge:8080/graphql"},{"name":"region","url":"http://region:8080/graphql"}]'
    ports:
      - "4000:8080"
    depends_on:
      users:
        condition: service_healthy
      documents:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      region:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opuspopuli-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
